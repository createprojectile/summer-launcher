name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish ./src/Summer.csproj -c Release -r win-x64 --self-contained false -o ./publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath "./Summer-${{ github.ref_name }}-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Summer ${{ github.ref_name }}
          files: ./Summer-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
